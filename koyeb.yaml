app: kebun-sawit
services:
  - name: web
    dockerfile: Dockerfile
    instance_type: nano
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    env:
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: PORT
        value: "3000"
    volumes:
      - name: data
        path: /data
        size: 2Gi
    health_checks:
      - path: /api/health
        port: 3000
        timeout: 5
        interval: 30
        initial_delay: 15
        retries: 10
